<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects - Northstar (content good)</title>
<style>
  :root { --ink: #18181b; --muted: #52525b; --focus: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: #fff; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  main { padding: 24px; max-width: 640px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 16px; max-width: 65ch; }
  label { display: block; margin-bottom: 4px; }
  input { display: block; width: 100%; height: 44px; margin: 0 0 16px; padding: 0 12px; font: inherit; border: 1px solid #52525b; border-radius: 8px; }
  input::placeholder { color: #6b6b6b; }
  .btn { height: 44px; padding: 0 16px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
  .btn-danger { background: #b91c1c; border-color: #b91c1c; color: #fff; }
  .row { display: flex; gap: 12px; margin-bottom: 24px; }
  .alert-error { padding: 12px 16px; background: #fee2e2; color: #7f1d1d; border-radius: 8px; margin-bottom: 16px; display: flex; gap: 16px; align-items: center; }
  .alert-error .btn { background: #fff; }
  .toasts { position: fixed; right: 16px; bottom: 16px; }
  .toast { padding: 12px 16px; background: #14532d; color: #fff; border-radius: 8px; }
  dialog { border: 0; border-radius: 16px; padding: 24px; width: min(420px, 100% - 32px); box-shadow: 0 2px 6px rgb(0 0 0 / .10), 0 24px 48px rgb(0 0 0 / .18); }
  dialog::backdrop { background: rgb(0 0 0 / .5); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Projects</h1>
  <h2>Create a new project</h2>
  <div class="row">
    <button type="button" class="btn">Invite team members</button>
    <button type="submit" class="btn">Create project</button>
    <button type="button" class="btn btn-danger" id="open-delete" aria-haspopup="dialog">Delete project</button>
  </div>
  <div class="alert-error" role="alert">
    <span>We couldn't load your invoices. Check your connection and try again.</span>
    <button type="button" class="btn">Retry</button>
  </div>
  <label for="mail">Email</label>
  <input id="mail" type="email" autocomplete="email" placeholder="maya@northstar.studio">
  <p>Assigned to Maya Chen, who joined in March.</p>
</main>
<div class="toasts" role="status"><div class="toast">Project renamed to Atlas</div></div>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">Delete project 'Atlas'?</h2>
  <p>This removes 24 invoices. You can't undo this.</p>
  <div class="actions">
    <button type="button" class="btn" id="delete-cancel">Cancel</button>
    <button type="button" class="btn btn-danger" id="delete-confirm">Delete project</button>
  </div>
</dialog>
<script>
  const dialog = document.getElementById('delete-dialog');
  document.getElementById('open-delete').addEventListener('click', () => dialog.showModal());
  document.getElementById('delete-cancel').addEventListener('click', () => dialog.close());
  document.getElementById('delete-confirm').addEventListener('click', () => dialog.close());
</script>
</body>
</html>
