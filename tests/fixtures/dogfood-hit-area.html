<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hit-area pseudo-elements vs contrast – shibroUI fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2937; background: #fff; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 24px; display: grid; gap: 24px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; }
  p { margin: 0; }
  .row { display: flex; gap: 12px; }
  /* The SU-61 hit-area pattern: the label sits in a span under the button's absolutely positioned ::before. */
  .btn { position: relative; height: 44px; padding: 0 16px; border: 0; border-radius: 8px; font: inherit; }
  .btn::before { content: ""; position: absolute; inset: -6px; }
  .archive { background: #1d4ed8; color: #fff; }
  /* Planted: #93c5fd on #3b82f6 is about 2:1. */
  .restore { background: #3b82f6; color: #93c5fd; }
</style>
</head>
<body>
<main id="main">
  <h1>Archived projects</h1>
  <p>Each button extends its hit area with an invisible ::before layer over its label.</p>
  <div class="row">
    <button type="button" class="btn archive"><span>Archive</span></button>
    <button type="button" class="btn restore"><span>Restore</span></button>
  </div>
</main>
</body>
</html>
