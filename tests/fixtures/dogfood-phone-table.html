<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices on a phone – shibroUI fixture</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; color: #18181b; background: #fff; }
  :focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .head h1 { margin: 0 auto 0 0; font-size: 24px; }
  .head button { min-height: 44px; padding: 0 12px; border: 1px solid #a1a1aa; border-radius: 8px; background: #fff; color: #18181b; font: inherit; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; min-width: 720px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #d4d4d8; white-space: nowrap; }
  td:first-child, th:first-child { position: sticky; left: 0; background: #fff; box-shadow: 1px 0 0 #d4d4d8; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="head"><h1>Invoices</h1><button type="button">Export</button><button type="button">Print</button><button type="button">Filters</button><button type="button">New invoice</button></div>
  <div class="scroll" tabindex="0" role="region" aria-label="Invoices">
    <table>
      <thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Status</th><th scope="col">Issued</th><th scope="col">Due</th><th scope="col" class="num">Amount</th></tr></thead>
      <tbody>
        <tr><td>INV-2041</td><td>Northwind Traders</td><td>Paid</td><td>3 Oct 2026</td><td>17 Oct 2026</td><td class="num">$12,480.00</td></tr>
        <tr><td>INV-2040</td><td>Orbit Logistics</td><td>Overdue</td><td>28 Sep 2026</td><td>12 Oct 2026</td><td class="num">$108,350.00</td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
