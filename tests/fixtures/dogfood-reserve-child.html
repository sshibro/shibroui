<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserved bold width on a child label – shibroUI fixture</title>
<style>
  body { margin: 0; padding: 32px; font: 16px/1.5 system-ui, sans-serif; color: #18181b; background: #fff; }
  :focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
  nav ul { display: flex; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; }
  nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #52525b; text-decoration: none; border-radius: 8px; }
  nav a[aria-current=page] { color: #18181b; font-weight: 600; background: #eef2ff; }
  /* The reservation lives on the label span, not on the link itself. */
  nav a .label { display: inline-flex; flex-direction: column; align-items: center; }
  nav a .label::after { content: attr(data-label); height: 0; overflow: hidden; visibility: hidden; font-weight: 600; }
  [role=menu] { display: grid; width: 200px; padding: 4px; border: 1px solid #e4e4e7; border-radius: 10px; }
  [role=menuitem] { min-height: 36px; padding: 0 10px; border: 0; background: none; text-align: left; font: inherit; color: #18181b; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Workspace</h1>
  <nav aria-label="Workspace"><ul>
    <li><a href="#overview" aria-current="page"><span class="label" data-label="Overview">Overview</span></a></li>
    <li><a href="#billing"><span class="label" data-label="Billing">Billing</span></a></li>
    <li><a href="#members"><span class="label" data-label="Members">Members</span></a></li>
  </ul></nav>
  <div role="menu" aria-label="Invoice actions">
    <button role="menuitem" type="button">View invoice</button>
    <button role="menuitem" type="button">Download PDF</button>
    <button role="menuitem" type="button">Duplicate</button>
  </div>
</main>
</body>
</html>
