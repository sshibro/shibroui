<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translucent header fill – shibroUI fixture</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #e5e7eb; background: #0e0f13; }
  .app { min-height: 100vh; background: #0e0f13; }
  /* The header is the page color at 82% so content blurs under it: one color, not a near-duplicate. */
  .bar { position: sticky; top: 0; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: rgb(14 15 19 / 82%); backdrop-filter: blur(12px); }
  .bar strong { font-size: 16px; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px; display: grid; gap: 24px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0; }
  h2 { font-size: 20px; line-height: 1.3; margin: 0 0 8px; }
  p { margin: 0; color: #a1a1aa; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: #1c1d24; border-radius: 12px; padding: 24px; }
</style>
</head>
<body>
<div class="app">
<header class="bar"><strong>Acme</strong></header>
<main id="main">
  <h1>Overview</h1>
  <div class="cards">
    <section class="card"><h2>Usage</h2><p>Requests this month across every project.</p></section>
    <section class="card"><h2>Billing</h2><p>Your plan, invoices and payment method.</p></section>
    <section class="card"><h2>Members</h2><p>People who can open this workspace.</p></section>
  </div>
</main>
</div>
</body>
</html>
