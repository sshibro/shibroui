<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaction states (clean)</title>
<style>
  :root { --on: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; background: #fff; color: #18181b; }
  :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  section { margin-bottom: 32px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 24px; }
  h2 { font-size: 18px; line-height: 1.3; margin: 0 0 12px; }

  /* Selecting a tab changes weight, but a hidden bold copy of the label reserves the bold width */
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid #d4d4d8; }
  .tab { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #3f3f46; font: inherit; }
  .tab::after { content: attr(data-label); display: block; height: 0; overflow: hidden; visibility: hidden; font-weight: 700; }
  .tab[aria-selected="true"] { font-weight: 700; color: #18181b; border-bottom-color: #2563eb; }

  /* Hover and press change paint only, and only where a pointer can hover */
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip, .tile { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #71717a; border-radius: 8px; background: #fff; color: #18181b; }
  @media (hover: hover) and (pointer: fine) { .chip:hover { background-color: #f4f4f5; } }
  .tile:active { background-color: #e4e4e7; }

  /* Every state keeps 4.5:1 */
  .ghost, .toggle { min-height: 44px; padding: 0 16px; border: 1px solid #71717a; border-radius: 8px; background: #fff; color: #18181b; font: inherit; }
  @media (hover: hover) and (pointer: fine) { .ghost:hover { background-color: #e4e4e7; color: #18181b; } }
  .toggle[aria-pressed="true"] { background: var(--on); color: #fff; border-color: var(--on); }

  /* The current page is underlined as well as recolored */
  .links { display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #3f3f46; text-decoration: none; }
  .links a[aria-current="page"] { color: #1d4ed8; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .3em; }

  /* The segmented control lifts its selected segment with a fill and a shadow */
  .seg { display: inline-flex; padding: 4px; border-radius: 12px; background: #e4e4e7; }
  .seg button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: transparent; color: #3f3f46; font: inherit; }
  .seg button[aria-checked="true"] { background: #fff; color: #18181b; box-shadow: 0 1px 3px rgb(0 0 0 / .2); }

  /* Disabled says why; read-only stays at full contrast */
  .field { display: flex; flex-direction: column; gap: 8px; max-width: 320px; margin-top: 16px; }
  .field input { height: 44px; padding: 0 12px; font: inherit; border: 1px solid #a1a1aa; border-radius: 8px; background: #fff; color: #18181b; }
  .field input[readonly] { background: #f4f4f5; border-style: dashed; }
  .publish { min-height: 44px; padding: 0 16px; border: 1px solid #a1a1aa; border-radius: 8px; background: #f4f4f5; color: #52525b; font: inherit; }
  .hint { margin: 8px 0 0; color: #52525b; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Interaction states</h1>
  <section>
    <h2>Tabs</h2>
    <div class="tabs" role="tablist" aria-label="Project">
      <button class="tab" role="tab" tabindex="-1" aria-selected="false" data-label="Overview" id="t1">Overview</button>
      <button class="tab" role="tab" aria-selected="true" data-label="Activity" id="t2">Activity</button>
      <button class="tab" role="tab" tabindex="-1" aria-selected="false" data-label="Settings" id="t3">Settings</button>
    </div>
  </section>
  <section>
    <h2>Hover and press</h2>
    <div class="row"><a class="chip" href="/tags/design">Design</a><a class="tile" href="/tags/code">Code</a></div>
  </section>
  <section>
    <h2>State colors</h2>
    <div class="row"><button class="ghost">Preview</button><button class="toggle" aria-pressed="true">Notifications</button></div>
  </section>
  <section>
    <h2>Current page</h2>
    <nav aria-label="Account"><ul class="links">
      <li><a href="/account/profile" aria-current="page">Profile</a></li>
      <li><a href="/account/billing">Billing</a></li>
      <li><a href="/account/security">Security</a></li>
    </ul></nav>
  </section>
  <section>
    <h2>View</h2>
    <div class="seg" role="radiogroup" aria-label="View">
      <button role="radio" aria-checked="false">List</button><button role="radio" aria-checked="true">Board</button><button role="radio" aria-checked="false">Calendar</button>
    </div>
  </section>
  <section>
    <h2>Publish</h2>
    <div><button class="publish" disabled aria-describedby="why">Publish</button><p class="hint" id="why">Publishing unlocks once the handbook has a title.</p></div>
    <div class="field"><label for="slug">Slug (read-only)</label><input id="slug" value="handbook-2026" readonly></div>
  </section>
</main>
</body>
</html>
