<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #18181b; background: #fff; }
  .top { position: sticky; top: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #1e293b; color: #fff; }
  .top a { color: #fff; }
  main { padding: 24px; max-width: 720px; }
  p { margin: 0 0 24px; }
  p a { color: #1d4ed8; text-decoration: underline; }
  button { min-height: 44px; padding: 0 16px; font: inherit; }
  .spacer { height: 900px; }
  .toast { position: fixed; right: 16px; bottom: 16px; padding: 12px 16px; background: #14532d; color: #fff; border-radius: 8px; }
  [role=tablist] { display: flex; gap: 8px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<header class="top">
  <a href="/a">Home</a><a href="/b">Reports</a><a href="/c">Billing</a><a href="/d">Team</a><a href="/e">Help</a><a href="/f">Account</a>
</header>
<main>
  <h1>Reports</h1>
  <p>Read the <a href="/docs">reporting guide</a> first. <a href="#nowhere">Jump</a></p>
  <button id="icon-only"><svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6"/></svg></button>
  <button aria-label="Go">Search products</button>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="48" height="48">
  <svg role="img" width="24" height="24"><rect width="24" height="24" fill="#334155"/></svg>
  <button tabindex="3">Priority action</button>
  <div aria-hidden="true"><button>Hidden but focusable</button></div>
  <button aria-controls="missing-panel" aria-expanded="false">Opens a missing panel</button>
  <p id="dup">First</p><p id="dup">Second</p>
  <div role="tablist" aria-label="Views">
    <button role="tab" id="t1">Daily</button>
    <button role="tab" id="t2" aria-selected="false">Weekly</button>
  </div>
  <button aria-haspopup="menu">Actions</button>
  <button aria-controls="more" id="disclosure">More details</button>
  <div id="more" hidden>Extra details live here.</div>
  <div role="alert">Profile saved</div>
  <div class="spacer"></div>
  <a href="/low-1">Low link one</a>
  <div class="spacer"></div>
  <a href="/low-2">Low link two</a>
  <div class="spacer"></div>
</main>
<main><p>Second main landmark.</p></main>
<div class="toast">Changes saved to your workspace</div>
</body>
</html>
