<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports - Northstar (semantics good)</title>
<style>
  :root { --ink: #18181b; --muted: #52525b; --accent: #1d4ed8; --focus: #2563eb; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; scroll-padding-bottom: 80px; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: #fff; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .skip { display: block; padding: 8px 24px; background: #e0e7ff; }
  .skip a { color: #1e3a8a; text-decoration: underline; display: inline-flex; align-items: center; min-height: 44px; }
  .top { position: sticky; top: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 24px; background: #1e293b; }
  .top a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #fff; text-decoration: none; }
  main { padding: 24px; max-width: 720px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; }
  p { margin: 0 0 24px; max-width: 65ch; }
  p a { color: var(--accent); text-decoration: underline; text-underline-offset: .2em; }
  .btn { height: 44px; padding: 0 16px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; }
  .icon-btn { width: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
  [role=tablist] { display: flex; gap: 8px; }
  [role=tab] { min-height: 44px; padding: 0 16px; border: 0; background: none; font: inherit; color: var(--muted); cursor: pointer; }
  [role=tab][aria-selected=true] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--ink); }
  .low { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); text-decoration: underline; }
  .spacer { height: 900px; }
  .toasts { position: fixed; right: 16px; bottom: 16px; }
  .toast { padding: 12px 16px; background: #14532d; color: #fff; border-radius: 8px; }
</style>
</head>
<body>
<div class="skip"><a href="#content">Skip to main content</a></div>
<header class="top">
  <a href="/home">Home</a><a href="/reports">Reports</a><a href="/billing">Billing</a><a href="/team">Team</a><a href="/help">Help</a>
</header>
<main id="content">
  <h1>Reports</h1>
  <p>Read the <a href="/docs">reporting guide</a> before you schedule a new report.</p>
  <div class="row">
    <button class="btn icon-btn" aria-label="Refresh reports"><svg width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="#18181b" stroke-width="2"/></svg></button>
    <button class="btn" aria-label="Search products">Search products</button>
    <button class="btn" aria-haspopup="menu" aria-expanded="false">Actions</button>
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="48" height="48" alt="Team avatar for Northstar">
    <svg role="img" aria-label="Status: healthy" width="24" height="24"><rect width="24" height="24" fill="#334155"/></svg>
  </div>
  <div role="tablist" aria-label="Views">
    <button role="tab" id="t1" aria-selected="true" aria-controls="p1" tabindex="0">Daily</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1">Weekly</button>
  </div>
  <div role="tabpanel" id="p1" aria-labelledby="t1"><p>Daily totals refresh every hour.</p></div>
  <div role="tabpanel" id="p2" aria-labelledby="t2" hidden><p>Weekly totals refresh every night.</p></div>
  <button class="btn" aria-controls="more" aria-expanded="false" id="disclosure">More details</button>
  <div id="more" hidden><p>Extra details live here.</p></div>
  <div class="spacer"></div>
  <p><a class="low" href="/low-1">Low link one</a></p>
  <div class="spacer"></div>
  <p><a class="low" href="/low-2">Low link two</a></p>
  <div class="spacer"></div>
</main>
<div class="toasts" role="status"><div class="toast">Changes saved to your workspace</div></div>
</body>
</html>
