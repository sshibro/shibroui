<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theming (bad)</title>
<style>
  /* planted: dark styles exist, but no color-scheme, a pure #000 base, raised cards no lighter than the base,
     a focus ring drawn only with box-shadow and a glass surface with text. Run with colorScheme dark. */
  :root { --bg: #ffffff; --card: #ffffff; --text: #18181b; --muted: #52525b; --focus: #6aa6ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #000000; --text: #e4e4e7; --muted: #a1a1aa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  main { padding: 32px 24px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 24px; max-width: 480px; box-shadow: 0 8px 24px rgb(0 0 0 / .5); }
  .card p { color: var(--muted); margin: 0 0 16px; max-width: 65ch; }
  .btn { height: 44px; padding: 0 16px; border: 1px solid #52525b; border-radius: 8px; background: transparent; color: var(--text); font: inherit; }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .glass { max-width: 480px; padding: 24px; border-radius: 12px; background: rgb(255 255 255 / .12); backdrop-filter: blur(12px); }
</style>
</head>
<body>
<main>
  <h1>Billing</h1>
  <section class="card">
    <p>Your plan renews on the 1st of each month.</p>
    <button class="btn">Manage plan</button>
  </section>
  <div class="glass">Translucent panel with text on top.</div>
</main>
</body>
</html>
