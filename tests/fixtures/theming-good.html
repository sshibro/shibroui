<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Theming (good)</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f5; --card: #ffffff; --text: #18181b; --muted: #52525b; --border: #d4d4d8; --accent: #2563eb; --on-accent: #ffffff; --focus: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1c1c1e; --text: #e4e4e7; --muted: #a1a1aa; --border: #52525b; --accent: #93b4f8; --on-accent: #0b1220; --focus: #93b4f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  main { padding: 32px 24px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; letter-spacing: -0.02em; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 24px; max-width: 480px; box-shadow: 0 8px 24px rgb(0 0 0 / .25); }
  .card p { color: var(--muted); margin: 0 0 16px; max-width: 65ch; }
  .btn { height: 44px; padding: 0 16px; border: 1px solid transparent; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .field { display: flex; flex-direction: column; gap: 8px; max-width: 320px; margin-bottom: 16px; }
  .field input { height: 44px; padding: 0 12px; font: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
  .actions { display: flex; gap: 12px; }
</style>
</head>
<body>
<main>
  <h1>Billing</h1>
  <section class="card">
    <p>Your plan renews on the 1st of each month.</p>
    <div class="field"><label for="email">Billing email</label><input id="email" type="email" autocomplete="email" value="billing@northstar.studio"></div>
    <div class="actions">
      <button class="btn">Manage plan</button>
      <button class="btn btn-secondary">Cancel plan</button>
    </div>
  </section>
</main>
</body>
</html>
